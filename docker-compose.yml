services:
  go127-v1:
    build: { context: ./go127-v1 }
    ports: ["8082:8080"]
  go127-v1-nojsonv2:
    build:
      context: ./go127-v1
      args:
        GOEXPERIMENT: nojsonv2
    ports: ["8084:8080"]
  go127-v2:
    build: { context: ./go127-v2 }
    ports: ["8083:8080"]
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
  loadgen:
    image: grafana/k6:1.1.0
    profiles: [load]
    volumes: ["./loadgen:/scripts:ro"]
    command: run /scripts/load.js

